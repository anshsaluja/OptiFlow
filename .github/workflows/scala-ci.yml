name: Scala core CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: sbt/setup-sbt@v1
      - name: Run optimizer regression suite
        run: sbt test
      - name: Generate allocation report for Docker dashboard smoke test
        run: sbt "runMain optiflow.AllocationReportCli datasets/demo output/allocation.json"
      - name: Generate real scenario snapshots from demo dataset
        run: sbt "runMain optiflow.ScenarioSnapshotCli datasets/demo output/scenarios"
      - name: Validate generated scenario manifest and report integrity
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          directory = Path("output/scenarios")
          manifest = json.loads((directory / "manifest.json").read_text())
          scenarios = manifest["scenarios"]
          assert scenarios, "Expected demo disruption scenarios"
          assert len(scenarios) <= 30
          assert len({entry["id"] for entry in scenarios}) == len(scenarios)

          reports = [manifest["baseline"]] + [entry["report"] for entry in scenarios]
          for filename in reports:
              assert Path(filename).name == filename and filename.endswith(".json"), filename
              report = json.loads((directory / filename).read_text())
              assert isinstance(report, dict), filename
              assert report, f"Empty report: {filename}"
          print(f"Validated baseline and {len(scenarios)} generated scenario reports")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dashboard test dependencies
        working-directory: dashboard
        run: npm install --no-audit --no-fund
      - name: Type-check and build SvelteKit dashboard
        working-directory: dashboard
        run: |
          npm run check
          npm run build
      - name: Validate real Scala snapshots against SvelteKit report contract
        working-directory: dashboard
        env:
          OPTIFLOW_SCENARIO_DIR: ../output/scenarios
        run: npm test
      - name: Validate Airflow DAG Python syntax and task wiring (without Airflow runtime)
        run: |
          python3 -m py_compile airflow/dags/optiflow_scenarios.py
          python3 -m unittest discover -s airflow -p 'test_*.py' -v
      - name: Test dashboard HTTP smoke harness and Docker Compose contract
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install DuckDB for scenario impact analytics
        run: python3 -m pip install 'duckdb>=1.1,<2'
      - name: Test DuckDB analytics and query real generated snapshots
        run: |
          python3 -m unittest discover -s analytics -p 'test_*.py' -v
          python3 analytics/scenario_analytics.py output/scenarios output/scenario-impact.csv
          test -s output/scenario-impact.csv
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Start containerized dashboard
        run: docker compose up --detach --no-build
      - name: Smoke test allocation dashboard and Scenario Lab over HTTP
        run: python3 scripts/smoke_dashboard.py
      - name: Capture Docker logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=150 || true
      - name: Stop Docker dashboard and remove test volumes
        if: always()
        run: docker compose down --volumes --remove-orphans || true
