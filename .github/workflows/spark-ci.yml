name: Spark pipeline CI
on:
  push:
    paths:
      - 'spark/**'
      - '.github/workflows/spark-ci.yml'
  pull_request:
    paths:
      - 'spark/**'
      - '.github/workflows/spark-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: sbt/setup-sbt@v1
      - name: Spark output verifier regression tests
        working-directory: spark
        run: python3 -m unittest discover -p 'test_*.py' -v
      - name: Spark normalization tests
        working-directory: spark
        run: sbt test
      - name: Execute real Parquet pipeline on demo data
        working-directory: spark
        run: sbt 'run ../datasets/demo ../output/spark-parquet parquet'
      - name: Verify Parquet output tables
        run: python3 spark/verify_outputs.py output/spark-parquet parquet
      - name: Install independent Parquet reader
        run: python3 -m pip install 'duckdb==1.4.1'
      - name: Read back all Spark Parquet tables with DuckDB
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import duckdb

          tables = ("warehouses", "stores", "routes", "route_opportunities", "network_summary")
          with duckdb.connect(":memory:") as con:
              for table in tables:
                  parts = sorted((Path("output/spark-parquet") / table).glob("part-*.parquet"))
                  if not parts:
                      raise AssertionError(f"No Parquet parts for {table}")
                  paths = [str(part) for part in parts]
                  # Decode each part independently: aggregate reads alone can hide
                  # inconsistent per-part schemas in partitioned output.
                  part_schemas = []
                  part_rows = 0
                  for part in paths:
                      part_columns = con.execute("DESCRIBE SELECT * FROM read_parquet(?)", [part]).fetchall()
                      part_schemas.append([(col[0], col[1]) for col in part_columns])
                      part_rows += con.execute("SELECT count(*) FROM read_parquet(?)", [part]).fetchone()[0]
                      con.execute("SELECT * FROM read_parquet(?) LIMIT 1", [part]).fetchall()
                  if any(schema != part_schemas[0] for schema in part_schemas[1:]):
                      raise AssertionError(f"Inconsistent Parquet part schemas in {table}")
                  rows = con.execute("SELECT count(*) FROM read_parquet(?)", [paths]).fetchone()[0]
                  if rows != part_rows:
                      raise AssertionError(f"Parquet row count mismatch in {table}: {rows} vs {part_rows}")
                  columns = con.execute("DESCRIBE SELECT * FROM read_parquet(?)", [paths]).fetchall()
                  if not columns:
                      raise AssertionError(f"Empty schema for {table}")
                  names = [column[0] for column in columns]
                  if len(names) != len(set(names)):
                      raise AssertionError(f"Duplicate Parquet column names in {table}: {names}")
                  # The demo's core dimensions and summary must contain data.
                  # Opportunity rows may legitimately be absent in some scenarios.
                  if table != "route_opportunities" and rows == 0:
                      raise AssertionError(f"Empty required demo Parquet table: {table}")
                  print(f"{table}: {rows} rows, {len(columns)} columns, {len(parts)} part files")
          PY
      - name: Execute real Delta Lake pipeline on demo data
        working-directory: spark
        run: sbt 'run ../datasets/demo ../output/spark-delta delta'
      - name: Verify Delta transaction logs and data
        run: python3 spark/verify_outputs.py output/spark-delta delta
      - name: Independently decode Delta Parquet data with DuckDB
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import duckdb
          from spark.delta_snapshot import active_delta_files

          tables = ("warehouses", "stores", "routes", "route_opportunities", "network_summary")
          with duckdb.connect(":memory:") as con:
              for table in tables:
                  parts = active_delta_files(Path("output/spark-delta") / table)
                  schema = None
                  total_rows = 0
                  for part in parts:
                      columns = con.execute("DESCRIBE SELECT * FROM read_parquet(?)", [str(part)]).fetchall()
                      current = [(col[0], col[1]) for col in columns]
                      if not current or len({name for name, _ in current}) != len(current):
                          raise AssertionError(f"Invalid Delta Parquet schema: {part}")
                      if schema is not None and current != schema:
                          raise AssertionError(f"Inconsistent Delta Parquet schemas: {table}")
                      schema = current
                      total_rows += con.execute("SELECT count(*) FROM read_parquet(?)", [str(part)]).fetchone()[0]
                      con.execute("SELECT * FROM read_parquet(?) LIMIT 1", [str(part)]).fetchall()
                  if table != "route_opportunities" and total_rows == 0:
                      raise AssertionError(f"Empty required Delta table: {table}")
                  print(f"Delta {table}: {total_rows} decoded rows, {len(parts)} parts")
          PY
      - name: Compare Parquet and Delta logical table contents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import duckdb
          from spark.delta_snapshot import active_delta_files

          tables = ("warehouses", "stores", "routes", "route_opportunities", "network_summary")
          with duckdb.connect(":memory:") as con:
              for table in tables:
                  parquet = [str(p) for p in sorted((Path("output/spark-parquet") / table).glob("part-*.parquet"))]
                  delta = [str(p) for p in active_delta_files(Path("output/spark-delta") / table)]
                  left = con.execute("DESCRIBE SELECT * FROM read_parquet(?)", [parquet]).fetchall()
                  right = con.execute("DESCRIBE SELECT * FROM read_parquet(?)", [delta]).fetchall()
                  if [(c[0], c[1]) for c in left] != [(c[0], c[1]) for c in right]:
                      raise AssertionError(f"Logical schema mismatch: {table}")
                  # EXCEPT ALL preserves duplicate multiplicity and handles NULLs.
                  for a, b in ((parquet, delta), (delta, parquet)):
                      difference = con.execute(
                          "SELECT count(*) FROM (SELECT * FROM read_parquet(?) "
                          "EXCEPT ALL SELECT * FROM read_parquet(?)) AS differences",
                          [a, b],
                      ).fetchone()[0]
                      if difference:
                          raise AssertionError(f"Logical row mismatch in {table}: {difference} unmatched rows")
                  print(f"{table}: Parquet and Delta contents agree")
          PY
